name: Release
'on':
  workflow_dispatch: null
concurrency: release-${{ github.repository }}
jobs:
  test:
    name: Test package
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    permissions:
      contents: read
      attestations: read
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Set up locked komizo
      uses: nicodes/komizo/setup@2ca94e2fd4bb05f41bb228e9c366e5cc733c75e6
      env:
        GH_TOKEN: ${{ github.token }}
      timeout-minutes: 5
    - name: Check project
      uses: nicodes/komizo/run@2ca94e2fd4bb05f41bb228e9c366e5cc733c75e6
      with:
        target: check
    - name: Build tested release bytes
      run: |
        set -euo pipefail
        python3 package/package.py build '@aviorstudio_gd-object-pool.zip'
        sha256sum '@aviorstudio_gd-object-pool.zip' > package.sha256
    - name: Upload artifacts
      uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
      with:
        name: release-bytes-${{ github.sha }}
        path: |
          @aviorstudio_gd-object-pool.zip
          package.sha256
        if-no-files-found: error
        retention-days: 7
    env:
      MISE_GITHUB_TOKEN: ${{ github.token }}
  publish:
    name: Publish release
    needs: test
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
    - name: Check out source
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
    - name: Download artifacts
      uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
      with:
        name: release-bytes-${{ github.sha }}
    - name: Verify release identity and tested bytes
      id: release
      run: |
        set -euo pipefail
        test "$GITHUB_REF" = 'refs/heads/main'
        sha256sum --check --strict package.sha256
        python3 package/package.py verify '@aviorstudio_gd-object-pool.zip'
        version=$(sed -nE 's/^version="([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' addon/plugin.cfg)
        test -n "$version"
        tag="v$version"
        if remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
          test "$remote_sha" = "$GITHUB_SHA"
        fi
        echo "version=$version" >> "$GITHUB_OUTPUT"
        echo "tag=$tag" >> "$GITHUB_OUTPUT"
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Create or verify GitHub release from tested bytes
      run: |
        set -euo pipefail
        tag='${{ steps.release.outputs.tag }}'
        if gh release view "$tag" >/dev/null 2>&1; then
          mkdir -p existing-release
          gh release download "$tag" --pattern '@aviorstudio_gd-object-pool.zip' --dir existing-release --clobber
          cmp '@aviorstudio_gd-object-pool.zip' 'existing-release/@aviorstudio_gd-object-pool.zip'
        else
          gh release create "$tag" '@aviorstudio_gd-object-pool.zip' --target "$GITHUB_SHA" --generate-notes
        fi
      env:
        GH_TOKEN: ${{ github.token }}
    - name: Publish addon
      uses: aviorstudio/gdam-actions/publish@3a46007e296e60e15a4ad47727ad33046e52e6ea
      with:
        addon: '@aviorstudio/gd-object-pool'
        tag: ${{ steps.release.outputs.tag }}
        asset: '@aviorstudio_gd-object-pool.zip'
        api-key: ${{ secrets.GDAM_API_KEY }}
