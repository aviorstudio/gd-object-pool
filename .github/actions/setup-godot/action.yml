name: 'Setup Godot'
description: 'Install the checksummed Godot 4.7.2 Linux editor'
inputs:
  godot-version:
    description: 'Godot version to install'
    required: true
runs:
  using: 'composite'
  steps:
    - name: Cache verified Godot archive
      id: cache-godot
      uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
      with:
        path: ${{ runner.temp }}/godot-download/Godot_v4.7.2-stable_linux.x86_64.zip
        key: godot-4.7.2-linux-x86-64-cadd3204

    - name: Install Godot
      shell: bash
      run: |
        set -euo pipefail
        test "${{ inputs.godot-version }}" = '4.7.2'
        archive="$RUNNER_TEMP/godot-download/Godot_v4.7.2-stable_linux.x86_64.zip"
        mkdir -p "$(dirname "$archive")" "$RUNNER_TEMP/godot-bin"
        if [ ! -f "$archive" ]; then
          curl -fL --retry 3 --retry-delay 2 -o "$archive" \
            https://github.com/godotengine/godot/releases/download/4.7.2-stable/Godot_v4.7.2-stable_linux.x86_64.zip
        fi
        printf '%s  %s\n' 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4' "$archive" | sha256sum --check --strict
        rm -f "$RUNNER_TEMP/godot-bin/godot"
        unzip -q -o "$archive" -d "$RUNNER_TEMP/godot-bin"
        mv "$RUNNER_TEMP/godot-bin/Godot_v4.7.2-stable_linux.x86_64" "$RUNNER_TEMP/godot-bin/godot"
        chmod +x "$RUNNER_TEMP/godot-bin/godot"
        echo "$RUNNER_TEMP/godot-bin" >> "$GITHUB_PATH"

    - name: Verify Godot installation
      shell: bash
      run: |
        set -euo pipefail
        test "$(godot --version)" = '4.7.2.stable.official.ed1daf0bf'
