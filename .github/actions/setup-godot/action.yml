name: "Set up Godot"
description: Install the reviewed Godot 4.7.2 engine through released shared setup
inputs:
  godot-version:
    description: Godot version, must match the reviewed 4.7.2 pin
    required: true
runs:
  using: composite
  steps:
    - name: Verify caller version
      shell: bash
      env:
        GODOT_VERSION: ${{ inputs.godot-version }}
      run: test "$GODOT_VERSION" = '4.7.2'
    - name: "Set up Godot"
      uses: nicodes/tools/godot-setup@ca747e13a51f301f51635c262d883d57d6084ae3 # v0.27.1
      with:
        version: '4.7.2'
        origin: godot
        binary-checksum: sha256:cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4
        expected-version: 4.7.2.stable.official.ed1daf0bf
