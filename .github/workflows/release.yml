name: Release

on:
  workflow_dispatch:

concurrency: release-${{ github.repository }}

jobs:
  test:
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Common exact-commit suite
        uses: ./.github/actions/test
      - name: Build tested release bytes
        run: |
          set -euo pipefail
          python3 package/package.py build '@aviorstudio_gd-object-pool.zip'
          sha256sum '@aviorstudio_gd-object-pool.zip' > package.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-bytes-${{ github.sha }}
          path: |
            @aviorstudio_gd-object-pool.zip
            package.sha256
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: test
    runs-on: blacksmith-2vcpu-ubuntu-2404
    timeout-minutes: 10
    environment: release
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-bytes-${{ github.sha }}
      - name: Verify release identity and tested bytes
        id: release
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = 'refs/heads/main'
          sha256sum --check --strict package.sha256
          python3 package/package.py verify '@aviorstudio_gd-object-pool.zip'
          version=$(sed -nE 's/^version="([0-9]+\.[0-9]+\.[0-9]+)"$/\1/p' addon/plugin.cfg)
          test -n "$version"
          tag="v$version"
          if remote_sha=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$tag" --jq '.object.sha' 2>/dev/null); then
            test "$remote_sha" = "$GITHUB_SHA"
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Create or verify GitHub release from tested bytes
        run: |
          set -euo pipefail
          tag='${{ steps.release.outputs.tag }}'
          if gh release view "$tag" >/dev/null 2>&1; then
            mkdir -p existing-release
            gh release download "$tag" --pattern '@aviorstudio_gd-object-pool.zip' --dir existing-release --clobber
            cmp '@aviorstudio_gd-object-pool.zip' 'existing-release/@aviorstudio_gd-object-pool.zip'
          else
            gh release create "$tag" '@aviorstudio_gd-object-pool.zip' --target "$GITHUB_SHA" --generate-notes
          fi
        env:
          GH_TOKEN: ${{ github.token }}
      - name: Publish exact release to GDAM
        uses: aviorstudio/gdam-actions/publish@6677226d9353df1d410f3e7f5075e13b3b7d5308 # v0.5.1
        with:
          addon: '@aviorstudio/gd-object-pool'
          tag: ${{ steps.release.outputs.tag }}
          asset: '@aviorstudio_gd-object-pool.zip'
          api-key: ${{ secrets.GDAM_API_KEY }}
